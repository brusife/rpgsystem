<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG System - Sua ficha de RPG grátis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div id="titulo"></div>
    </header>
    <main>
        <form action="ficha.php" method="get">
            <div class="total">
                <div class="item">
                    <h1>Crie sua ficha de RPG</h1>
                    <hr>
                </div>
                <div class="item">
                    <p><label for="nome">Nome: </label><input type="text" name="nome" id="nome" autocomplete="off" maxlength="30" required placeholder="até 30 caracteres"></p>
                </div>
                <div class="item">
                    <div class="itemi">
                        <div class="subi">
                            Gênero:
                                <select name="genero" id="menu">
                                    <option>Masculino</option>
                                    <option>Feminino</option>
                                </select>
                        </div>
                        
                        <div class="subi">
                            Raça:
                                <select name="raca" id="menu">
                                    <option>Humano</option>
                                    <option>Elfo</option>
                                    <option>Anão</option>
                                    <option>Orc</option>
                                    <option>Elfo-Noturno</option>
                                    <option>Goblin</option>
                                </select>
                        </div>
                        
                        <div class="subi">
                            Classe:
                                <select name="classe" id="menu">
                                    <option>Bárbaro</option>
                                    <option>Bardo</option>
                                    <option>Bruxo</option>
                                    <option>Caçador</option>
                                    <option>Clérigo</option>
                                    <option>Druida</option>
                                    <option>Feiticeiro</option>
                                    <option>Guerreiro</option>
                                    <option>Ladino</option>
                                    <option>Mago</option>
                                    <option>Monge</option>
                                    <option>Paladino</option>
                                </select>
                        </div>
                    </div>
                    

                    <div class="atributos">
                        <div class="suba"><h1>Atributos Físicos</h1>
                            <hr>
                        <div class="subs">
                            <p><img src="icones/constituicao.png" alt="ícone de constituição" height="18px"> Constituição <input type="number" name="con" id="icon" class="valores" min="0" max="10" step="1" value="5"></p>
                           <p><img src="icones/forca.png" alt="ícone de força" height="18px"> Força <input type="number" name="for" id="ifor"  class="valores" min="0" max="10" step="1" value="5"></p>
                            <p><img src="icones/destreza.png" alt="ícone de destreza" height="18px"> Destreza <input type="number" name="dex" class="valores" id="idex" min="0" max="10" step="1" value="5"></p>
                            <p><img src="icones/agilidade.png" alt="ícone de agilidade" height="18px"> Agilidade <input type="number" class="valores" name="agi" id="iagi" min="0" max="10" step="1" value="5"></p>
                            </div>
                        </div>
                        <div class="suba" ><h1>Atributos Mentais</h1>
                            <hr>
                        <div class="subs">
                            <p><img src="icones/inteligencia.png" alt="ícone de inteligência" height="18px"> Inteligência <input type="number" name="int" id="iint" min="0" max="10" step="1" value="5" class="valores"></p>
                            <p><img src="icones/forcadevontade.png" alt="ícone de força de vontade" height="18px"> Força de Vontade <input type="number" name="forv" id="iforv"  min="0" max="10" step="1" value="5"class="valores"></p>
                            <p><img src="icones/carisma.png" alt="ícone de carisma" height="18px"> Carisma <input type="number" name="car" id="icar" min="0" max="10" step="1" value="5" class="valores"></p>
                            <p><img src="icones/percepcao.png" alt="ícone de percepção" height="18px"> Percepção <input type="number" name="per" id="iper" min="0" max="10" step="1" value="5" class="valores"></p>
                        </div>
                        </div>
                    </div>
            
                    <div class="item">
                        <hr><h1>Descrição</h1>
            
                        <p><textarea name="info" id="info" cols="75" rows="6" maxlength="500">Descreva o(a) personagem em até 500(quinhentos) caracteres</textarea></p>
            
                    </div>
                    <div class="item">
                        <h1><input type="submit" value="Criar" class="botao"><img src="icones/criar.png" alt=""></h1>
                    </div>
            
                </div>
            
            </div>
        </form>
       
        
    </main>
</body>
</html>
